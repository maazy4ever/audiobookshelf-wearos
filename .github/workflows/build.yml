name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wear-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shelfwatch-wear-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish companion-windows/ShelfWatchCompanion -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o companion-windows/publish
      - uses: actions/upload-artifact@v4
        with:
          name: shelfwatch-companion-windows
          path: companion-windows/publish/ShelfWatchCompanion.exe
